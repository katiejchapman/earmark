name: earmark
options:
  bundleIdPrefix: com.katiechapman
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: 1,2
    DEVELOPMENT_TEAM: V5J2P9R87P
targets:
  Earmark:
    type: application
    platform: iOS
    sources:
    - Earmark
    - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.katiechapman.earmark
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) EARMARK_APP"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_CFBundleDisplayName: earmark
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: true
        INFOPLIST_KEY_UIBackgroundModes: audio
        INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsArbitraryLoadsForMedia: true
        MARKETING_VERSION: '1.0'
        CURRENT_PROJECT_VERSION: '1'
    info:
      path: Earmark/Info.plist
      properties:
        UIAppFonts:
        - Modak-Regular.ttf
        - Quicksand.ttf
        UIBackgroundModes:
        - audio
        CFBundleDocumentTypes:
        - CFBundleTypeName: Audio recording
          CFBundleTypeRole: Viewer
          LSHandlerRank: Alternate
          LSItemContentTypes:
          - public.audio
          - public.mpeg-4-audio
          - public.mp3
          - com.microsoft.waveform-audio
          - public.mpeg-4
          - public.movie
        LSSupportsOpeningDocumentsInPlace: true
        NSAppTransportSecurity:
          NSAllowsArbitraryLoadsForMedia: true
        UISupportedInterfaceOrientations:
        - UIInterfaceOrientationPortrait
        - UIInterfaceOrientationPortraitUpsideDown
        - UIInterfaceOrientationLandscapeLeft
        - UIInterfaceOrientationLandscapeRight
        CFBundleURLTypes:
        - CFBundleURLName: com.katiechapman.earmark.widget
          CFBundleURLSchemes:
          - earmark
    dependencies:
    - target: EarmarkWidget
      embed: true
    entitlements:
      path: Earmark/Earmark.entitlements
      properties:
        com.apple.security.application-groups:
        - group.com.katiechapman.earmark
    attributes:
      SystemCapabilities:
        com.apple.ApplicationGroups.iOS:
          enabled: 1
  EarmarkTests:
    type: bundle.unit-test
    platform: iOS
    sources:
    - EarmarkTests
    dependencies:
    - target: Earmark
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
  EarmarkUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
    - EarmarkUITests
    dependencies:
    - target: Earmark
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
  EarmarkWidget:
    type: app-extension
    platform: iOS
    sources:
    - EarmarkWidget
    - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.katiechapman.earmark.widget
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: true
        MARKETING_VERSION: '1.0'
        CURRENT_PROJECT_VERSION: '1'
        APPLICATION_EXTENSION_API_ONLY: true
        SKIP_INSTALL: true
    entitlements:
      path: EarmarkWidget/EarmarkWidget.entitlements
      properties:
        com.apple.security.application-groups:
        - group.com.katiechapman.earmark
    info:
      path: EarmarkWidget/Info.plist
      properties:
        CFBundleDisplayName: earmark
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    attributes:
      SystemCapabilities:
        com.apple.ApplicationGroups.iOS:
          enabled: 1
schemes:
  Earmark:
    build:
      targets:
        Earmark: all
    test:
      targets:
      - EarmarkTests
      - EarmarkUITests
