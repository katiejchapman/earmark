<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>earmark · rhinestones & listening tabs · v9 mockup</title>
<style>
:root{color-scheme:dark;--paper:#1b181f;--ink:#efe7ee;--card:#29252e;--line:#514653;--muted:#b6a9b7;--pink:#dfa3bf;--listened:#9fc8c2;--metal:linear-gradient(135deg,#777880,#42454d 28%,#686b73 49%,#34373d)}
[data-theme=light]{color-scheme:light;--paper:#f1eae4;--ink:#363834;--card:#fcf7f2;--line:#c9bfb9;--muted:#746973;--listened:#49796f;--metal:linear-gradient(135deg,#f2f3ee,#bfc4bd 28%,#e4e6df 49%,#a5aca5)}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px -apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;padding:26px 20px 40px}.shell{max-width:440px;margin:auto}button,input{font:inherit;color:inherit}button{cursor:pointer}button:focus-visible,summary:focus-visible,input:focus-visible{outline:2px solid var(--pink);outline-offset:4px}button{border:0;background:none}header{display:flex;align-items:center;gap:16px;margin-bottom:22px}header img{width:72px;height:72px}h1{font:italic 600 38px Georgia,serif;letter-spacing:-2px;margin:0}#theme{margin-left:auto;width:44px;height:44px;border:1px solid var(--line);border-radius:50%;font-size:23px;background:var(--card)}.link-row{display:flex;gap:8px}input{width:100%;min-width:0;border:1px solid var(--line);border-radius:12px;background:var(--card);padding:12px;font-size:14px}.load{background:var(--pink);color:#442836;font-weight:600;padding:0 16px;border-radius:12px;min-height:44px}.link-tools{display:flex;justify-content:space-between;margin:4px 0 14px}.link-tools button{font-size:12px;min-height:36px;color:var(--pink)}
.player{background:var(--metal);border:1px solid #94919b;border-radius:30px;padding:17px 20px 14px;box-shadow:inset 0 1px 1px #ffffff70,inset 0 -2px 4px #0004}.jewels{display:flex;justify-content:space-between;align-items:center;gap:7px;padding:1px 9px 15px;pointer-events:none}.stone{position:relative;display:block;flex:0 0 13px;width:13px;height:13px;border-radius:50%;background:conic-gradient(from 20deg,#dce0e3,#66636a 14%,#faffff 25%,#8c858f 42%,#d4d0d8 58%,#5d5864 75%,#ecedf1);box-shadow:0 1px 2px #17131b99,inset 0 0 0 .5px #eff2f4}.stone:before{content:"";position:absolute;inset:1.1px;clip-path:polygon(29% 0,71% 0,100% 29%,100% 71%,71% 100%,29% 100%,0 71%,0 29%);background:conic-gradient(from 22.5deg,#fff8ff 0 12.5%,#bd538e 12.5% 25%,#f3c2dc 25% 37.5%,#8d3868 37.5% 50%,#e69ac0 50% 62.5%,#fff4ff 62.5% 75%,#b46f98 75% 87.5%,#f5d5e7 87.5%);box-shadow:inset 0 0 2px #822253}.stone:after{content:"";position:absolute;inset:3.6px;clip-path:polygon(29% 0,71% 0,100% 29%,100% 71%,71% 100%,29% 100%,0 71%,0 29%);background:linear-gradient(135deg,#fffaff 0%,#f7daea 17%,#edb0d0 39%,#d67fac 65%,#f8d9ec 100%);border:.4px solid #fff8}.stone:nth-child(3n){transform:rotate(24deg)}.stone:nth-child(4n):before{filter:brightness(1.12)}.stone:nth-child(5n):after{background:linear-gradient(40deg,#bc648f,#f4bfdc 47%,white 51%,#e5a2c6 60%)}
.display{background:linear-gradient(125deg,#c2d5ac,#9dbb90);border:5px solid #888d8c;border-radius:13px;padding:13px 14px;color:#2e3d28;min-height:111px;box-shadow:inset 0 2px 4px #30442f35}.display small{display:block;font:9px ui-monospace,monospace;letter-spacing:2px;margin-bottom:9px}.display h2{font:600 18px/1.35 ui-monospace,monospace;margin:0 0 6px}.display p{font:11px ui-monospace,monospace;margin:0}.scrub{width:100%;height:28px;padding:0;background:none;border:0;accent-color:#c47b9f;margin:10px 0 0}.times{display:flex;justify-content:space-between;font:12px ui-monospace,monospace}.times button{font:inherit;padding:0}.controls{position:relative;display:flex;justify-content:center;align-items:center;gap:18px;margin-top:6px;height:62px}.control{display:grid;place-items:center;width:44px;height:44px;background:#66656e;border:1px solid #928693;color:#faf2f7;border-radius:50%;font:700 10px ui-monospace,monospace;padding:0}.control.play{width:58px;height:58px;background:#dfa3bf;border:3px solid #b97998;color:#583346}.play svg{width:23px;height:23px;display:block}.charm{position:absolute;pointer-events:none;font:27px Arial,sans-serif;color:#ba5a8a;text-shadow:0 2px #fff2f8,1px 0 #8d4769;left:0;top:0;transform:rotate(-19deg)}.charm.flower{font-size:22px;color:#77a8af;top:38px;left:24px;transform:rotate(16deg)}.charm.diamond{left:auto;right:0;top:20px;transform:rotate(13deg);font-size:29px}.player-bottom{display:flex;justify-content:space-between;align-items:center;margin-top:10px;position:relative}.outline{font:10px ui-monospace,monospace;border:1px solid #a39aa6;border-radius:12px;padding:5px 12px;height:27px;min-width:58px;color:inherit}.tap-area{padding:8px 0}.sleep-options{position:absolute;bottom:45px;left:0;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:13px;box-shadow:0 8px 24px #0005;padding:5px;width:165px;z-index:5}.sleep-options[hidden],.sleep-options button[hidden]{display:none}.sleep-options button{display:block;text-align:left;width:100%;padding:12px;border-radius:8px;font-size:13px}.sleep-options button:hover{background:#dfa3bf25}.speaker{height:22px;margin:9px 7px 15px;border-radius:6px 6px 18px 18px;background:radial-gradient(circle,#16161c 1px,transparent 1.6px) 0 0/5px 5px,#555761;box-shadow:inset 0 2px 4px #0005}.jewels.bottom{padding:0 25px;gap:5px}.jewels.bottom .stone{flex-basis:11px;width:11px;height:11px}
.archive-heading{display:flex;justify-content:space-between;align-items:center;margin:25px 0 14px}.archive-heading h2{font-size:25px;font-weight:500;margin:0;letter-spacing:-.6px}.archive-heading button{font-size:22px;width:44px;height:40px;color:var(--muted)}.folder-create{display:flex;gap:8px;margin-bottom:17px}.folder-create button{background:var(--card);border:1px solid var(--line);border-radius:12px;width:44px;flex-shrink:0;font-size:24px}.folder{margin-bottom:16px}.folder-head{display:flex;align-items:center;border-radius:16px;background:var(--card);padding:0 13px}.folder-head>button{min-height:50px}.folder-toggle{flex:1;display:flex;align-items:center;justify-content:space-between;text-align:left;font-size:14px;font-weight:500;gap:12px}.count{font-weight:400;color:var(--muted);margin-left:5px}.chevron{font-size:16px;color:var(--muted)}.folder-more{font-size:20px;color:var(--muted);width:36px;margin-left:8px}.folder-body{padding:12px 11px 0}.tabs{display:flex;border-bottom:1px solid var(--line);margin-bottom:2px;gap:24px}.tabs button{font-size:12px;color:var(--muted);padding:0 0 10px;position:relative}.tabs button[aria-selected=true]{color:var(--ink)}.tabs button[aria-selected=true]:after{content:"";position:absolute;bottom:-1px;left:0;right:0;background:var(--pink);height:2px;border-radius:2px}.tabs span{font-size:10px;margin-left:4px;color:var(--muted)}.entry{display:flex;align-items:center;gap:12px;border-bottom:1px solid #51465370;padding:14px 0;min-height:68px}.entry:last-child{border-bottom:0}.entry-copy{flex:1;min-width:0}.entry-title{display:block;text-align:left;font-size:14px;padding:0;line-height:1.4}.entry small{display:block;color:var(--muted);font-size:11px;margin-top:5px}.entry.done .entry-title{color:var(--listened)}.entry.done .check{display:grid;place-items:center;flex:0 0 18px;width:18px;height:18px;border:1.5px solid var(--listened);color:var(--listened);border-radius:50%;font-size:11px;margin-left:auto}.entry-menu{color:var(--muted);font-size:17px;padding:5px 0 5px 6px}.empty{color:var(--muted);font-size:12px;padding:18px 0}.demo-note{font:11px/1.6 ui-monospace,monospace;color:var(--muted);margin-top:24px;border-top:1px solid var(--line);padding-top:14px}dialog{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:20px;padding:20px;max-width:300px;width:85%}dialog::backdrop{background:#0008}dialog button{display:block;width:100%;text-align:left;padding:13px 5px;font-size:14px}dialog p{color:var(--muted);font-size:12px;margin:0 0 8px}#toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);max-width:90%;background:var(--card);border:1px solid var(--line);padding:12px 20px;border-radius:30px;font-size:12px;z-index:20}#toast[hidden]{display:none}@media(max-width:360px){body{padding:20px 16px}.player{padding-left:17px;padding-right:17px}.stone{width:11px;height:11px;flex-basis:11px}.jewels{gap:4px}header{gap:12px}h1{font-size:34px}}
.scrub{appearance:none;-webkit-appearance:none;border-radius:0;background:linear-gradient(to right,#b85280 0 var(--progress,21%),#8f988b var(--progress,21%) 100%) center/100% 4px no-repeat}.scrub::-webkit-slider-thumb{appearance:none;-webkit-appearance:none;width:16px;height:16px;border-radius:50%;border:1px solid #7b8588;background:radial-gradient(circle at 35% 30%,white,#dce0df 35%,#aeb5b7 65%,#737c80);box-shadow:0 2px 2px #0003}.scrub::-moz-range-thumb{width:16px;height:16px;border-radius:50%;border:1px solid #7b8588;background:radial-gradient(circle at 35% 30%,white,#dce0df 35%,#aeb5b7 65%,#737c80)}
</style></head>
<body><main class="shell">
<header><img src="../ios/Earmark/Assets.xcassets/Disc.imageset/Disc.png" alt=""><h1>earmark</h1><button id="theme" aria-label="Switch to light mode">☀</button></header>
<div class="link-row"><input id="url" type="url" aria-label="Audio or podcast link" placeholder="Paste an audio or podcast link"><button class="load" id="load">Load</button></div>
<div class="link-tools"><button id="save">Save link</button><button id="import">Import audio</button></div>
<section class="player" aria-label="Audio player">
<div class="jewels" aria-hidden="true"></div>
<div class="display"><small>▶ NOW PLAYING</small><h2 id="episode">A conversation about listening</h2><p id="playingFolder">Our Struggle</p></div>
<input class="scrub" id="scrub" type="range" min="0" max="3720" value="784" aria-label="Playback position">
<div class="times"><span id="elapsed">13:04</span><button id="time">−48:56 left</button></div>
<div class="controls"><span class="charm" aria-hidden="true">♥</span><span class="charm flower" aria-hidden="true">✿</span><span class="charm diamond" aria-hidden="true">✦</span><button class="control" id="back" aria-label="Back 15 seconds">« 15</button><button class="control play" id="play" aria-label="Play"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></button><button class="control" id="forward" aria-label="Forward 15 seconds">15 »</button></div>
<div class="player-bottom"><div class="tap-area"><button class="outline" id="sleep" aria-expanded="false" aria-controls="sleepOptions">sleep</button></div><div class="sleep-options" id="sleepOptions" hidden><button data-minutes="5">5 minutes</button><button data-minutes="15">15 minutes</button><button data-minutes="30">30 minutes</button><button id="cancelSleep" hidden>Cancel timer</button></div><div class="tap-area"><button class="outline" id="reset">reset</button></div></div>
<div class="speaker" aria-hidden="true"></div><div class="jewels bottom" aria-hidden="true"></div>
</section>
<div class="archive-heading"><h2>archive</h2><button aria-label="Library options" id="libraryOptions">⋯</button></div>
<div class="folder-create"><input id="folderName" aria-label="Folder name" placeholder="Folder name"><button id="addFolder" aria-label="Create folder">+</button></div>
<div id="folders"></div>
<p class="demo-note">v9 · interactive design mockup<br>Try the folder tabs, sleep button, and item options. Sample entries only; this preview does not change your app or archive.</p>
</main><dialog id="actions"><p id="actionTitle"></p><div id="actionButtons"></div><button id="closeActions">Cancel</button></dialog><div id="toast" role="status" hidden></div>
<script>
const $=id=>document.getElementById(id);const folderData=[{name:'Our Struggle',open:true,tab:location.hash==='#listened'?'listened':'listening',items:[{title:'A conversation about listening',time:'13:04 / 1:02:00',done:false},{title:'Notes from a long walk',time:'Not started',done:false},{title:'On books and friendship',time:'1:18:24 · finished',done:true}]},{name:'Unarchived',open:false,tab:'listening',items:[{title:'An afternoon recording',time:'Not started',done:false}]}];
let toastTimer;function toast(text){$('toast').textContent=text;$('toast').hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').hidden=true,2500)}
function actionMenu(title,options){$('actionTitle').textContent=title;$('actionButtons').replaceChildren();for(const [label,fn] of options){const b=document.createElement('button');b.textContent=label;b.onclick=()=>{$('actions').close();fn()};$('actionButtons').append(b)}$('actions').showModal()}
function render(){const host=$('folders');host.replaceChildren();folderData.forEach(f=>{const section=document.createElement('section');section.className='folder';const head=document.createElement('div');head.className='folder-head';const toggle=document.createElement('button');toggle.className='folder-toggle';toggle.setAttribute('aria-expanded',f.open);const name=document.createElement('span');name.textContent=f.name;const count=document.createElement('span');count.className='count';count.textContent='· '+f.items.length;name.append(count);const chevron=document.createElement('span');chevron.className='chevron';chevron.textContent=f.open?'⌄':'›';toggle.append(name,chevron);toggle.onclick=()=>{f.open=!f.open;render()};head.append(toggle);if(f.name!=='Unarchived'){const menu=document.createElement('button');menu.className='folder-more';menu.textContent='⋯';menu.setAttribute('aria-label','Options for '+f.name);menu.onclick=()=>actionMenu(f.name,[['Rename folder',()=>{const n=prompt('Folder name',f.name);if(n?.trim()){f.name=n.trim();render()}}]]);head.append(menu)}section.append(head);if(f.open){const body=document.createElement('div');body.className='folder-body';const tabs=document.createElement('div');tabs.className='tabs';tabs.setAttribute('role','tablist');tabs.setAttribute('aria-label',f.name+' listening status');for(const status of ['listening','listened']){const b=document.createElement('button');b.setAttribute('role','tab');b.setAttribute('aria-selected',f.tab===status);b.textContent=status;const c=document.createElement('span');c.textContent=f.items.filter(i=>i.done===(status==='listened')).length;b.append(c);b.onclick=()=>{f.tab=status;render()};tabs.append(b)}body.append(tabs);const items=f.items.filter(i=>i.done===(f.tab==='listened'));for(const item of items){const row=document.createElement('div');row.className='entry'+(item.done?' done':'');const copy=document.createElement('div');copy.className='entry-copy';const title=document.createElement('button');title.className='entry-title';title.textContent=item.title;const meta=document.createElement('small');meta.textContent=item.time;copy.append(title,meta);const options=()=>actionMenu(item.title,[['Load in player',()=>{$('episode').textContent=item.title;$('playingFolder').textContent=f.name;toast('Loaded in preview player')}],[item.done?'Mark as listening':'Mark as listened',()=>{item.done=!item.done;render();toast(item.done?'Moved to listened':'Moved to listening')}]]);title.onclick=options;row.append(copy);const menu=document.createElement('button');menu.className='entry-menu';menu.textContent='⋯';menu.setAttribute('aria-label','Options for '+item.title);menu.onclick=options;row.append(menu);if(item.done){const check=document.createElement('span');check.className='check';check.textContent='✓';check.setAttribute('aria-label','Listened');row.append(check)}body.append(row)}if(!items.length){const p=document.createElement('p');p.className='empty';p.textContent=f.tab==='listened'?'Nothing listened to yet.':'Nothing waiting to be heard.';body.append(p)}section.append(body)}host.append(section)})}
for(const strip of document.querySelectorAll('.jewels'))for(let i=0;i<13;i++){const stone=document.createElement('i');stone.className='stone';strip.append(stone)}
$('theme').onclick=()=>{const dark=document.documentElement.dataset.theme!=='dark';document.documentElement.dataset.theme=dark?'dark':'light';$('theme').textContent=dark?'☀':'☾';$('theme').setAttribute('aria-label',dark?'Switch to light mode':'Switch to dark mode')};$('closeActions').onclick=()=>$('actions').close();
let deadline=null;function sleepText(){if(!deadline)return;const left=Math.max(0,Math.ceil((deadline-Date.now())/1000));$('sleep').textContent='sleep '+format(left);if(!left){deadline=null;$('sleep').textContent='sleep';$('play').setAttribute('aria-label','Play');toast('Sleep timer finished')}}$('sleep').onclick=()=>{const show=$('sleepOptions').hidden;$('sleepOptions').hidden=!show;$('sleep').setAttribute('aria-expanded',show)};for(const button of document.querySelectorAll('[data-minutes]'))button.onclick=()=>{deadline=Date.now()+Number(button.dataset.minutes)*60000;sleepText();$('cancelSleep').hidden=false;$('sleepOptions').hidden=true;$('sleep').setAttribute('aria-expanded',false)};$('cancelSleep').onclick=()=>{$('cancelSleep').hidden=true;deadline=null;$('sleep').textContent='sleep';$('cancelSleep').hidden=true;$('sleepOptions').hidden=true;$('sleep').setAttribute('aria-expanded',false)};setInterval(sleepText,1000);
function format(seconds){return Math.floor(seconds/60)+':'+String(seconds%60).padStart(2,'0')}let remaining=true;function updateTime(){$('scrub').style.setProperty('--progress',(+$('scrub').value/3720*100)+'%');$('elapsed').textContent=format(+$('scrub').value);$('time').textContent=remaining?'−'+format(3720-$('scrub').value)+' left':'1:02:00'}$('scrub').oninput=updateTime;$('time').onclick=()=>{remaining=!remaining;updateTime()};$('back').onclick=()=>{$('scrub').value=+$('scrub').value-15;updateTime()};$('forward').onclick=()=>{$('scrub').value=+$('scrub').value+15;updateTime()};let playing=false;$('play').onclick=()=>{playing=!playing;$('play').innerHTML=playing?'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>':'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>';$('play').setAttribute('aria-label',playing?'Pause':'Play')};
function save(load){let url;try{url=new URL($('url').value);if(!['http:','https:'].includes(url.protocol))throw 0}catch{toast('Enter a full audio link to try this');return}const f=folderData.find(f=>f.name==='Unarchived');let item=f.items.find(i=>i.url===url.href);if(!item){item={title:decodeURIComponent(url.pathname.split('/').pop()||url.hostname),time:'Not started',done:false,url:url.href};f.items.push(item)}f.open=true;if(load){$('episode').textContent=item.title;$('playingFolder').textContent='Unarchived'}else{$('url').value=''}render();toast(load?'Loaded in preview player':'Saved to Unarchived')}$('save').onclick=()=>save(false);$('load').onclick=()=>save(true);$('import').onclick=()=>toast('Import stays in the native app');$('reset').onclick=()=>{$('episode').textContent='A little listening time';$('playingFolder').textContent='';$('scrub').value=0;updateTime()};$('addFolder').onclick=()=>{const name=$('folderName').value.trim();if(!name)return;if(folderData.some(f=>f.name.toLowerCase()===name.toLowerCase()))return toast('That folder already exists');folderData.push({name,open:true,tab:'listening',items:[]});$('folderName').value='';render()};$('libraryOptions').onclick=()=>toast('Preview only · your archive is untouched');render();
</script></body></html>
