<script>
const fileIcon='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 7V5h7l3 3h8v12H3Z"/><path d="M3 8h18M16 11v6M13 14h6"/></svg>',saveIcon='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m-4-4 4 4 4-4M4 14v6h16v-6"/></svg>';
for(const variant of ['a','b']){const fragment=document.querySelector('template').content.cloneNode(true),app=fragment.querySelector('.option');app.classList.add(variant);app.querySelector('.option-label').innerHTML=variant==='a'?'<b>A · recommended</b> — link or file, then an action':'<b>B</b> — switch between link and file';const input='<input class="url" type="url" placeholder="enter link" aria-label="Audio link">',load='<button class="bubble load">load</button>',save='<button class="bubble save" aria-label="Save to archive" title="Save to archive">'+saveIcon+'</button>';app.querySelector('.source-area').innerHTML=variant==='a'?'<div class="source-row">'+input+'<span class="or">or</span><button class="bubble add-file">'+fileIcon+'add file</button></div><div class="actions">'+load+save+'</div><p class="source-status"></p>':'<div class="segmented" aria-label="Audio source"><button class="source-link" aria-pressed="true">link</button><button class="source-file" aria-pressed="false">file</button></div><div class="source-row">'+input+'<button class="bubble file-source" hidden>'+fileIcon+'<span>add file</span></button>'+load+save+'</div><p class="source-status"></p>';
for(let i=0;i<11;i++){const img=document.createElement('img');img.src='assets/round-rhinestone-native-v11.svg';img.alt='';app.querySelector('.jewels').append(img)}for(const shape of ['heart-pink','flower-blue','diamond-purple','star-yellow','moon-silver']){const img=document.createElement('img');img.src='assets/stickers-v16/'+shape+'.svg';img.alt='';app.querySelector('.sheet').append(img)}
let selectedFile=null;const url=app.querySelector('.url'),picker=app.querySelector('.file-input'),status=app.querySelector('.source-status'),toast=app.querySelector('.toast');const pick=()=>picker.click();app.querySelector('.add-file')?.addEventListener('click',pick);app.querySelector('.file-source')?.addEventListener('click',pick);picker.onchange=()=>{selectedFile=picker.files[0]||null;if(!selectedFile)return;url.value='';status.textContent=selectedFile.name;if(variant==='b')app.querySelector('.file-source span').textContent=selectedFile.name};url.oninput=()=>{selectedFile=null;status.textContent=''};if(variant==='b'){for(const mode of ['link','file'])app.querySelector('.source-'+mode).onclick=()=>{for(const m of ['link','file'])app.querySelector('.source-'+m).setAttribute('aria-pressed',m===mode);url.hidden=mode==='file';app.querySelector('.file-source').hidden=mode==='link';selectedFile=null;url.value='';status.textContent=''}}
function source(){return selectedFile?.name||url.value.trim()}app.querySelector('.load').onclick=()=>{if(!source()){status.textContent='Choose a link or file first.';return}app.querySelector('.episode').textContent=selectedFile?.name||'Selected link';toast.textContent='Preview: loaded and saved to archive.';status.textContent=''};app.querySelector('.save').onclick=()=>{if(!source()){status.textContent='Choose a link or file first.';return}toast.textContent='Preview: saved to archive; playback continues.';status.textContent=''};
app.querySelector('.entries').innerHTML=[['Torrey Peters',57],['Ben Moser',81]].map(([name,p])=>'<div class="entry"><div class="entry-top"><span class="filename">'+name+'</span><div class="mini-progress" aria-label="'+p+'% played"><div class="mini-track"><div class="mini-fill" style="width:'+p+'%"></div></div><span class="percentage">'+p+'%</span></div><button class="entry-more" aria-label="File options">⋯</button></div><div class="folder-name">Unarchived</div></div>').join('');
const player=app.querySelector('.player'),decorate=app.querySelector('.decorate'),sheet=app.querySelector('.sheet-wrap');function edit(on){player.classList.toggle('editing',on);decorate.setAttribute('aria-pressed',on);sheet.hidden=!on}decorate.onclick=()=>edit(!player.classList.contains('editing'));app.querySelector('.done').onclick=()=>edit(false);app.querySelector('.play').onclick=e=>{const b=e.currentTarget,playing=b.getAttribute('aria-label')==='Play';b.setAttribute('aria-label',playing?'Pause':'Play');b.querySelector('span').textContent=playing?'Ⅱ':'▶'};app.querySelector('.sleep').onclick=e=>{const on=e.currentTarget.classList.toggle('active');app.querySelector('.sleep-count').textContent=on?'sleep 14:32':''};app.querySelector('.reset').onclick=()=>{app.querySelector('.episode').textContent='earmark';app.querySelector('.lcd-meta').firstElementChild.textContent='';toast.textContent='Preview: player reset; archive retained.'};
// Move in subpixel steps and resolve each axis independently: stop at an edge,
// then keep sliding along it. Never accept an invalid position or spring back.
const overlaps=(a,b)=>a.left<b.right&&a.right>b.left&&a.top<b.bottom&&a.bottom>b.top;
for(const gem of app.querySelectorAll('.gem')){let drag=null;const valid=(x,y)=>{const rect=player.getBoundingClientRect(),w=gem.offsetWidth,h=gem.offsetHeight,angle=gem.classList.contains('heart')?14:gem.classList.contains('flower')?17:12,rad=angle*Math.PI/180,fw=w*Math.cos(rad)+h*Math.sin(rad),fh=w*Math.sin(rad)+h*Math.cos(rad),cx=rect.left+player.clientLeft+x+w/2,cy=rect.top+player.clientTop+y+h/2,box={left:cx-fw/2-2,right:cx+fw/2+2,top:cy-fh/2-2,bottom:cy+fh/2+2};if(box.left<rect.left+8||box.right>rect.right-8||box.top<rect.top+8||box.bottom>rect.bottom-8)return false;for(const obstacle of player.querySelectorAll('[data-obstacle],.gem')){if(obstacle===gem)continue;if(overlaps(box,obstacle.getBoundingClientRect()))return false}return true};gem.onpointerdown=e=>{if(!player.classList.contains('editing'))return;e.preventDefault();gem.setPointerCapture(e.pointerId);drag={px:e.clientX,py:e.clientY,x:gem.offsetLeft,y:gem.offsetTop};};gem.onpointermove=e=>{if(!drag)return;const dx=e.clientX-drag.px,dy=e.clientY-drag.py,steps=Math.ceil(Math.max(Math.abs(dx),Math.abs(dy))/.65);for(let i=0;i<steps;i++){if(valid(drag.x+dx/steps,drag.y))drag.x+=dx/steps;if(valid(drag.x,drag.y+dy/steps))drag.y+=dy/steps}gem.style.left=drag.x+'px';gem.style.top=drag.y+'px';drag.px=e.clientX;drag.py=e.clientY};gem.onpointerup=gem.onpointercancel=()=>drag=null;}
document.querySelector('main').append(fragment)}document.querySelector('#theme').onclick=()=>{const root=document.documentElement,on=root.dataset.theme==='dark';root.dataset.theme=on?'light':'dark';document.querySelector('#theme').textContent=on?'☾':'☼'};
